name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize branch name
        id: branch
        run: echo "name=$(echo '${{ github.head_ref }}' | sed 's/[\/:]/-/g')" >> $GITHUB_OUTPUT

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - run: uv run mkdocs build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: preview/${{ steps.branch.outputs.name }}
          keep_files: true

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Preview deployed

      - name: Post preview URL
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Preview deployed:** https://wesroach.dev/preview/${{ steps.branch.outputs.name }}/
          edit-mode: replace

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Sanitize branch name
        id: branch
        run: echo "name=$(echo '${{ github.head_ref }}' | sed 's/[\/:]/-/g')" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "preview/${{ steps.branch.outputs.name }}"
          git add -A
          git diff --cached --quiet || git commit -m "Remove preview for ${{ github.head_ref }}"
          git push
