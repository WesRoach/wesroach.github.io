# Project information
site_name: 'Wes Roach'
site_description: 'Personal site of Wes Roach'
site_author: 'Wes Roach'
site_url: 'http://wesroach.dev'

nav:
  - Summary: index.md
  - Abode:
    - Bermuda Grass:
      - Schedule: bermuda_schedule.md
  - Workstation:
    - Shell Setup:
      - Git Helpers: workstation/shell-setup/index.md
  # - Python:
  #   - 10Apps: python/10apps.md
  # - Pandas: pandas/pandas.md
  # - Kubernetes:
  #   - EDx: kubernetes/edx.md
  # - Networking:
  #   - OSI: networking/osi.md
  #   - ARP: networking/arp.md
  #   - Subnetting: networking/subnetting.md
  # - License: license.md

# Repository
repo_name: 'WesRoach/wesroach.github.io'
repo_url: 'https://github.com/WesRoach/wesroach.github.io'

# Copyright
copyright: 'Copyright &copy; 2026 Wes Roach'

# Configuration
theme:
  name: 'material'
  custom_dir: overrides
  language: 'en'
  palette:
    - scheme: default
      primary: white
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  features:
    - navigation.instant
    - search.suggest
    - search.highlight
use_directory_urls: false

# Hooks
hooks:
  - hooks/recent_articles.py

# Custom CSS
extra_css:
  - stylesheets/custom.css

# Customization
extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: 'https://github.com/WesRoach'
    - icon: fontawesome/brands/twitter
      link: 'https://twitter.com/WesRoach'
    - icon: fontawesome/brands/linkedin
      link: 'https://www.linkedin.com/in/wes-roach/'
  search:
    tokenizer: '[\s\-\.]+'


# Google Analytics
google_analytics:
  - 'UA-113461484-1'
  - 'auto'

# Extensions
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: true
  - toc:
      permalink: true
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
